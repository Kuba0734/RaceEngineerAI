[package]
name = "race-engineer-ai"
version = "0.1.0"
description = "RaceEngineerAI – sim racing pit crew over radio"
authors = ["Kuba0734"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "race_engineer_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# App shell
tauri = { version = "2.12.5", features = [] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
# Serialization / types
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12.0.1"
# Async, net
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart", "stream", "http2", "charset"] }
futures-util = "0.3.34"
# Errors, logging
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
# Storage
rusqlite = { version = "0.41.1", features = ["bundled"] }
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"
dirs = "7.0.0"
# Concurrency
parking_lot = "0.13.0"
crossbeam-channel = "0.5.17"
# System / input
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
gilrs = "0.11.2"
# Audio, speech
cpal = "0.18.2"
sherpa-onnx = "2.0.1"
hound = "3.5.1"
rand = "0.10.3"
# Model downloads (sherpa-onnx release archives are .tar.bz2)
sha2 = "0.11.1"
bzip2 = "0.6"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Gaming_Input",
  "Foundation",
  "Foundation_Collections",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
